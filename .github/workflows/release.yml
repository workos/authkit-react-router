name: Release

on:
  # Support manually pushing a new release
  workflow_dispatch: {}
  # Invoked by the release-please workflow when a release is created
  workflow_call:
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: WorkOS public Socket Firewall auth token for protected dependency downloads.
        required: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d  # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: |
          npm install

      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d  # v1

      - name: Build project
        run: |
          npm run build

      - name: Publish
        run: |
          npm publish --tag latest --access=public --provenance
